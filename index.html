<!DOCTYPE html><html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:#050b16;
  color:#00eaff;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.app{width:92%;max-width:500px;padding:20px}
h1{letter-spacing:8px;text-shadow:0 0 20px #00eaff}
.circle{
  width:190px;height:190px;border:3px solid #00eaff;
  border-radius:50%;margin:30px auto;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 25px #00eaff,inset 0 0 25px #00eaff;
  animation:pulse 2s infinite;
}
.circle span{font-size:48px}
@keyframes pulse{
  50%{box-shadow:0 0 45px #00eaff,inset 0 0 35px #00eaff}
}
#status{color:#9defff;min-height:24px}
button{
  background:#00eaff;color:#001018;border:0;
  padding:14px 20px;border-radius:10px;
  font-weight:bold;font-size:16px;margin:8px;
}
#answer{color:white;margin-top:25px;line-height:1.6}
input{
  width:100%;padding:14px;border-radius:10px;
  border:1px solid #00eaff;background:#101b2b;
  color:white;font-size:16px;margin-top:15px;
}
</style>
</head>
<body>
<div class="app">
  <h1>J.A.R.V.I.S.</h1>
  <p>PERSONAL AI ASSISTANT</p>
  <div class="circle"><span>AI</span></div>
  <p id="status">Sistem hazır.</p>
  <button onclick="listen()">🎙️ Konuş</button>
  <input id="question" placeholder="JARVIS'e bir şey yaz...">
  <button onclick="ask()">Gönder</button>
  <div id="answer">Merhaba! Ben JARVIS. Seni dinliyorum.</div>
</div>
<script>
function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const msg=new SpeechSynthesisUtterance(text);
  msg.lang='tr-TR';
  speechSynthesis.speak(msg);
}
function reply(text){
  const q=text.toLocaleLowerCase('tr-TR');
  let a='';
  if(q.includes('merhaba')||q.includes('selam')){
    a='Merhaba! Ben JARVIS, kişisel asistanın.';
  }else if(q.includes('adın')){
    a='Benim adım JARVIS.';
  }else if(q.includes('saat')){
    a='Telefonunun saati: '+new Date().toLocaleTimeString('tr-TR');
  }else if(q.includes('tarih')){
    a='Bugünün tarihi: '+new Date().toLocaleDateString('tr-TR');
  }else if(q.includes('nasılsın')){
    a='Sistemlerim çalışıyor. Sana nasıl yardımcı olabilirim?';
  }else{
    a='Seni duydum. Şu anda temel sürümdeyim; gelişmiş yapay zekâ bağlantım henüz kurulmadı.';
  }
  document.getElementById('answer').textContent=a;
  speak(a);
}
function ask(){
  const input=document.getElementById('question');
  if(!input.value.trim())return;
  reply(input.value);
  input.value='';
}
function listen(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    document.getElementById('status').textContent='Ses tanıma desteklenmiyor. Chrome ile deneyebilirsin.';
    return;
  }
  const recognition=new SpeechRecognition();
  recognition.lang='tr-TR';
  recognition.onstart=()=>document.getElementById('status').textContent='Seni dinliyorum...';
  recognition.onresult=e=>{
    const text=e.results[0][0].transcript;
    document.getElementById('question').value=text;
    reply(text);
    document.getElementById('status').textContent='Dinleme tamamlandı.';
  };
  recognition.onerror=()=>document.getElementById('status').textContent='Mikrofon iznini ve internet bağlantını kontrol et.';
  recognition.start();
}
</script>
</body>
</html>
