<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:#00eaff;font-family:Arial,sans-serif;text-align:center}
header{padding:25px 10px;font-size:28px;font-weight:bold;letter-spacing:5px}
.circle{width:180px;height:180px;border:3px solid #00eaff;border-radius:50%;margin:35px auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px #00eaff;animation:pulse 2s infinite}
.circle span{font-size:48px}
@keyframes pulse{50%{box-shadow:0 0 55px #0088ff}}
#status{margin:20px;font-size:14px}
#chat{margin:20px auto;max-width:600px;height:220px;overflow-y:auto;text-align:left;padding:15px;border:1px solid #075b75;border-radius:12px;color:white}
input{width:65%;padding:14px;border-radius:8px;border:1px solid #00eaff;background:#101a28;color:white}
button{padding:13px;margin:5px;border:0;border-radius:8px;background:#00cde8;color:#001018;font-weight:bold}
</style>
</head>
<body>
<header>J.A.R.V.I.S.</header>
<div class="circle"><span>◉</span></div>
<div id="status">Sistem hazır. Beni çağırabilirsin.</div>
<div id="chat"></div>
<input id="message" placeholder="Jarvis'e bir şey sor...">
<button onclick="sendMessage()">GÖNDER</button>
<button onclick="startVoice()">🎙️ KONUŞ</button>
<script>
const chat=document.getElementById('chat');
const statusText=document.getElementById('status');

function addMessage(who,text){
 const p=document.createElement('p');
 p.textContent=who+': '+text;
 chat.appendChild(p);
 chat.scrollTop=chat.scrollHeight;
}

function speak(text){
 if('speechSynthesis' in window){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='tr-TR';
  speechSynthesis.speak(u);
 }
}

async function sendMessage(){
 const input=document.getElementById('message');
 const message=input.value.trim();
 if(!message)return;
 addMessage('Efecan',message);
 input.value='';
 statusText.textContent='Yanıt hazırlanıyor...';

 let answer;
 const q=message.toLocaleLowerCase('tr-TR');

 if(q.includes('merhaba')||q.includes('selam')){
  answer='Merhaba! Ben Jarvis. Sana nasıl yardımcı olabilirim?';
 }else if(q.includes('adın ne')){
  answer='Ben Jarvis, kişisel yapay zekâ asistanınım.';
 }else if(q.includes('saat')){
  answer='Telefonunun saatine bakabilirsin. Şu an cihaz saati: '+new Date().toLocaleTimeString('tr-TR');
 }else if(q.includes('tarih')){
  answer='Bugünün tarihi: '+new Date().toLocaleDateString('tr-TR');
 }else if(q.includes('kimsin')){
  answer='Ben Jarvis. Komutlarını bekliyorum!';
 }else{
  answer='Bu temel sürümde henüz gelişmiş yapay zekâ bağlantısı yok. Bunun için güvenli bir sunucu üzerinden yapay zekâ API bağlantısı kurmamız gerekiyor.';
 }
 addMessage('JARVIS',answer);
 statusText.textContent='Sistem hazır.';
 speak(answer);
}

function startVoice(){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  statusText.textContent='Ses tanıma desteklenmiyor. Chrome ile dene.';
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang='tr-TR';
 recognition.onstart=()=>statusText.textContent='Seni dinliyorum...';
 recognition.onresult=(event)=>{
  document.getElementById('message').value=event.results[0][0].transcript;
  sendMessage();
 };
 recognition.onerror=()=>statusText.textContent='Mikrofon kullanılamadı. İzinleri kontrol et.';
 recognition.onend=()=>{if(statusText.textContent==='Seni dinliyorum...')statusText.textContent='Sistem hazır.'};
 recognition.start();
}
document.getElementById('message').addEventListener('keydown',e=>{
 if(e.key==='Enter')sendMessage();
});
</script>
</body>
</html>
